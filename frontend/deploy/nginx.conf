# Servidor para la app web Flutter (build/web) con cabeceras de seguridad.
# Es una plantilla de nginx: al arrancar el contenedor se sustituyen ${PORT} y ${API_BASE_URL}
# (ver frontend/Dockerfile). El resto de variables de nginx ($uri, etc.) no se tocan.
# Compilar con:  flutter build web -t lib/main_web.dart --release --no-web-resources-cdn
# (así CanvasKit se sirve desde el propio origen y no desde el CDN de Google).
server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;                       # no revelar versión de nginx

    location / {
        try_files $uri $uri/ /index.html;
        # Cabeceras dentro del location: nginx no hereda add_header si el location define alguno.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ${API_BASE_URL} https://fonts.gstatic.com https://fonts.googleapis.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # HSTS: solo surte efecto bajo HTTPS (descomentar al terminar TLS en este servidor o en el proxy).
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }
}
