# Configuración de Railway para la web (Flutter + nginx). En el servicio:
# Settings > Source > Root Directory = /frontend
# Settings > Config-as-code > Railway Config File = /frontend/railway.toml
#
# Variable obligatoria del servicio: API_BASE_URL = https://<dominio público de la API>
# (se compila dentro de la app y se agrega al CSP de nginx; debe ser HTTPS).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/frontend/**"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
