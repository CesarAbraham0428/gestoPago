sonar.projectKey=gestopago-frontend
sonar.projectName=GestoPago Frontend (Flutter)
sonar.host.url=http://localhost:9001
sonar.sourceEncoding=UTF-8
sonar.sources=lib
sonar.tests=test

# Cobertura (flutter test --coverage)
sonar.flutter.coverage.reportPath=coverage/lcov.info

# El sensor de analisis del plugin (0.5.2, de 2024) falla con SonarQube 26 (usa una clase
# interna ya eliminada). Se le da un reporte vacio y los hallazgos de `dart analyze`
# se importan como "issues externos" (ver scripts/sonar-frontend.ps1).
sonar.dart.analyzer.mode=MANUAL
sonar.dart.analyzer.report.mode=MACHINE
sonar.dart.analyzer.report.path=reports/analyzer-vacio.txt
sonar.externalIssuesReportPaths=reports/dart-analyze-sonar.json
sonar.dart.analyzer.options.override=false

# Solo los puntos de entrada (main) quedan fuera de cobertura: unicamente llaman a iniciarAplicacion.
sonar.coverage.exclusions=lib/main_web.dart,lib/main_mobile.dart
