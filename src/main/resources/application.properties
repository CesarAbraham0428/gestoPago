spring.application.name=gestopago-api
server.port=${SERVER_PORT:8080}

spring.cloud.config.enabled=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Redis/Memurai local. Se puede cambiar con REDIS_HOST y REDIS_PORT.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
gestopago.catalog.cache-ttl=${REDIS_CATALOGO_CACHE_TTL:24h}

gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}
gestopago.catalog.url=${GESTOPAGO_CATALOG_URL:${gestopago.auth.url}}
gestopago.auth.id-distribuidor=${GESTOPAGO_AUTH_ID_DISTRIBUIDOR}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_AUTH_CODIGO_DISPOSITIVO}
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD}
# El token dura 24 h y GestoPago pide obtener uno por día (la respuesta no trae expires_in).
gestopago.auth.refresh-rate-ms=${GESTOPAGO_AUTH_REFRESH_RATE_MS:86400000}
gestopago.auth.renewal-check-ms=${GESTOPAGO_AUTH_RENEWAL_CHECK_MS:60000}
spring.cloud.openfeign.client.config.gestopago-auth.connectTimeout=${GESTOPAGO_AUTH_CONNECT_TIMEOUT_MS:5000}
spring.cloud.openfeign.client.config.gestopago-auth.readTimeout=${GESTOPAGO_AUTH_READ_TIMEOUT_MS:10000}

# Sincronización diaria del catálogo (03:00, hora de Ciudad de México).
gestopago.catalog.sync-cron=${GESTOPAGO_CATALOG_SYNC_CRON:0 0 3 * * *}
gestopago.catalog.sync-zone=${GESTOPAGO_CATALOG_SYNC_ZONE:America/Mexico_City}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
gestopago.catalog.path=${GESTOPAGO_CATALOG_PATH:/sistema/service/getProductList.do}
gestopago.catalog.connect-timeout-ms=${GESTOPAGO_CATALOG_CONNECT_TIMEOUT_MS:5000}
gestopago.catalog.read-timeout-ms=${GESTOPAGO_CATALOG_READ_TIMEOUT_MS:15000}
spring.cloud.openfeign.client.config.gestopago-catalog.connectTimeout=${gestopago.catalog.connect-timeout-ms}
spring.cloud.openfeign.client.config.gestopago-catalog.readTimeout=${gestopago.catalog.read-timeout-ms}

# JWT para las sesiones de la aplicación (distinto del token de GestoPago).
gestopago.app.jwt.secret=${APP_JWT_SECRET}
gestopago.app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:28800000}

# Las respuestas se construyen dentro de los servicios transaccionales.
spring.jpa.open-in-view=false

# Renovación diaria forzada del token de GestoPago (00:00, hora de Ciudad de México).
gestopago.auth.renewal-cron=${GESTOPAGO_AUTH_RENEWAL_CRON:0 0 0 * * *}
gestopago.auth.renewal-zone=${GESTOPAGO_AUTH_RENEWAL_ZONE:America/Mexico_City}

# Pago de servicios (sendTx.do / confirmTx.do). El JSON se cifra con AES-256-CBC (llave de 32 bytes e IV de 16, en Base64)
# y se envía como x-www-form-urlencoded en los campos "random" y "signed".
gestopago.pagos.url=${GESTOPAGO_PAGOS_URL:${gestopago.auth.url}}
gestopago.pagos.path=${GESTOPAGO_PAGOS_PATH:/sistema/service/sendTx.do}
gestopago.pagos.confirm-path=${GESTOPAGO_PAGOS_CONFIRM_PATH:/sistema/service/confirmTx.do}
gestopago.pagos.secret_key=${GESTOPAGO_PAGOS_SECRET_KEY}
gestopago.pagos.iv=${GESTOPAGO_PAGOS_IV}
gestopago.pagos.parametro-firma=${GESTOPAGO_PAGOS_PARAMETRO_FIRMA:signed}
# Cabecera X-API-Key: solo si GestoPago asignó una al distribuidor.
gestopago.pagos.api-key=${GESTOPAGO_PAGOS_API_KEY:}
gestopago.pagos.unidad=${GESTOPAGO_PAGOS_UNIDAD:Sucursal Matriz}
gestopago.pagos.zona=${GESTOPAGO_PAGOS_ZONA:America/Mexico_City}
# Cada cuánto se consultan con confirmTx los pagos sin respuesta.
gestopago.pagos.conciliacion-ms=${GESTOPAGO_PAGOS_CONCILIACION_MS:60000}
spring.cloud.openfeign.client.config.gestopago-pagos.connectTimeout=${GESTOPAGO_PAGOS_CONNECT_TIMEOUT_MS:5000}
# GestoPago espera hasta 62 s antes de abandonar una transacción; el timeout de lectura debe ser mayor.
spring.cloud.openfeign.client.config.gestopago-pagos.readTimeout=${GESTOPAGO_PAGOS_READ_TIMEOUT_MS:70000}